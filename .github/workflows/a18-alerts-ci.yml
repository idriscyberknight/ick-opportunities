name: A1.8 In-App Alert Design — Safe Code CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/opportunity-alerts.ts"
      - "src/lib/alert-staging-client.ts"
      - "src/routes/_authenticated/alerts-staging.tsx"
      - "src/lib/matching.ts"
      - "src/components/alerts/**"
      - "src/routes/_authenticated/alerts-preview.tsx"
      - "tests/a18/**"
      - "docs/alerts/**"
      - ".github/workflows/a18-alerts-ci.yml"

permissions:
  contents: read

concurrency:
  group: a18-alerts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pure opt-in tests, TypeScript/build and scoped lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked packages
        run: bun install --frozen-lockfile
      - name: Test alert derivation and existing ranking regression
        run: bun test tests/a18
      - name: Verify production build and strict TypeScript
        run: bun run build
      - name: Lint changed production source
        run: |
          bunx eslint \
            src/lib/opportunity-alerts.ts \
            src/lib/alert-staging-client.ts \
            src/routes/_authenticated/alerts-staging.tsx \
            src/lib/matching.ts \
            src/components/alerts/AlertPreferencesPanel.tsx \
            src/components/alerts/NotificationCenterPanel.tsx \
            src/routes/_authenticated/alerts-preview.tsx
