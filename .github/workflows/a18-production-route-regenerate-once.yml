name: A1.8 Production Pilot — One-Time Route Tree Regeneration

on:
  push:
    branches:
      - feat/a18-production-optin-dark-launch-20261026
    paths:
      - ".github/workflows/a18-production-route-regenerate-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'idriscyberknight/ick-opportunities'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/a18-production-optin-dark-launch-20261026
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate the route tree via the existing Vite plugin
        run: bun run build
      - name: Check the Production pilot route is registered
        run: |
          grep -q 'AuthenticatedAlertsRouteImport' src/routeTree.gen.ts
          grep -q "'/alerts'" src/routeTree.gen.ts
      - name: Commit generated route tree ONLY to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(a18): include /alerts in generated route tree"
            git push origin HEAD:feat/a18-production-optin-dark-launch-20261026
          fi

# One-time temporary helper. Remove file in this branch after success.
# DOES NOT deploy, alter Supabase, create users, or enable production flag.
