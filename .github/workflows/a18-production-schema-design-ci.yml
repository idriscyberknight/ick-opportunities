name: A1.8 Production Alert Schema — Disposable PG17 Review Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "design/a18/alert_production_schema_REVIEW_ONLY.sql"
      - "design/a18/alert_production_post_commit_READ_ONLY.sql"
      - "design/a18/alert_production_postflight_READ_ONLY.sql"
      - "tests/a18/production_pg17_*.sql"
      - ".github/workflows/a18-production-schema-design-ci.yml"
      - "docs/alerts/ICK_A18_PRODUCTION_SCHEMA_REVIEW_2026-10-26.md"

permissions:
  contents: read

concurrency:
  group: a18-production-schema-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-pg17:
    name: Isolated PG17 positive and wrong-target negative; NO Cloud access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_USER: postgres
          POSTGRES_DB: a18_prod_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a18_prod_review_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_disposable_only
      PGDATABASE: a18_prod_review_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify disposable Postgres version
        run: psql -X -v ON_ERROR_STOP=1 -c 'SHOW server_version;'
      - name: Bootstrap synthetic Production-signature fixture in isolated DB
        run: psql -X -v ON_ERROR_STOP=1 -f tests/a18/production_pg17_fixture.sql
      - name: Parse and apply REVIEW-ONLY Production DDL in disposable CI DB ONLY
        run: psql -X -v ON_ERROR_STOP=1 -f design/a18/alert_production_schema_REVIEW_ONLY.sql
      - name: Assert all post-commit read-only schema, RLS and privileges checks
        shell: bash
        run: |
          set -euo pipefail
          psql -X -A -t -q -v ON_ERROR_STOP=1 \
            -f design/a18/alert_production_post_commit_READ_ONLY.sql \
            | jq -e '.status == "PASS" and .checked == 22'
      - name: Test mock-auth RLS owner isolation, opt-out, column grants and dedupe
        run: psql -X -v ON_ERROR_STOP=1 -f tests/a18/production_pg17_security.sql
      - name: Parse read-only postflight report against disposable migrated DB
        run: psql -X -v ON_ERROR_STOP=1 -f design/a18/alert_production_postflight_READ_ONLY.sql
      - name: Negative test — never replay a migrated database
        shell: bash
        run: |
          set -euo pipefail
          # The earlier security step left 2 synthetic preferences and 5 synthetic
          # notification records in the disposable positive-test database.
          before="$(psql -X -At -v ON_ERROR_STOP=1 -c "
            SELECT (SELECT count(*) FROM public.alert_preferences)::text || ':' ||
                   (SELECT count(*) FROM public.user_notifications)::text || ':' ||
                   (SELECT count(*) FROM public.opportunities)::text;")"
          test "$before" = "2:5:4"
          if psql -X -v ON_ERROR_STOP=1 \
             -f design/a18/alert_production_schema_REVIEW_ONLY.sql \
             > /tmp/a18_replay_guard.log 2>&1; then
            echo "FAIL: Production DDL silently replayed an existing installation"
            exit 1
          fi
          grep -q 'A1.8 PRODUCTION STOP: alert objects already exist' /tmp/a18_replay_guard.log
          after="$(psql -X -At -v ON_ERROR_STOP=1 -c "
            SELECT (SELECT count(*) FROM public.alert_preferences)::text || ':' ||
                   (SELECT count(*) FROM public.user_notifications)::text || ':' ||
                   (SELECT count(*) FROM public.opportunities)::text;")"
          test "$before" = "$after"
          echo "PASS: rejected replay without changing previously inserted data"

      - name: Negative test — roll back fully on a mid-DDL index collision
        shell: bash
        run: |
          set -euo pipefail
          createdb a18_collision_ci
          export PGDATABASE=a18_collision_ci
          # This database passes the normal preflight before reaching the
          # deliberate failure AFTER CREATE TABLE statements have started.
          psql -X -v ON_ERROR_STOP=1 -f tests/a18/production_pg17_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -c '
            CREATE TABLE public.a18_collision_holder (id uuid PRIMARY KEY);
            CREATE INDEX a18_notifications_user_created_idx
              ON public.a18_collision_holder(id);'
          if psql -X -v ON_ERROR_STOP=1 \
             -f design/a18/alert_production_schema_REVIEW_ONLY.sql \
             > /tmp/a18_mid_ddl_collision.log 2>&1; then
            echo "FAIL: Production DDL unexpectedly committed after index collision"
            exit 1
          fi
          grep -q 'relation "a18_notifications_user_created_idx" already exists' /tmp/a18_mid_ddl_collision.log
          result="$(psql -X -At -v ON_ERROR_STOP=1 -c "
            SELECT CASE WHEN
              to_regclass('public.alert_preferences') IS NULL AND
              to_regclass('public.user_notifications') IS NULL AND
              to_regprocedure('public.a18_preferences_stamp_updated()') IS NULL AND
              to_regprocedure('public.a18_notification_stamp_actions()') IS NULL AND
              (SELECT count(*) FROM public.opportunities) = 4 AND
              to_regclass('public.a18_collision_holder') IS NOT NULL
            THEN 'PASS' ELSE 'FAIL' END;")"
          test "$result" = PASS
          echo "PASS: atomic rollback prevented partial alert schema and preserved existing fixture"

      - name: Negative test — refuse a non-Production-signature database without changes
        shell: bash
        run: |
          set -euo pipefail
          createdb a18_wrong_target_ci
          export PGDATABASE=a18_wrong_target_ci
          psql -X -v ON_ERROR_STOP=1 -f tests/a18/production_pg17_minimal_fixture.sql
          if psql -X -v ON_ERROR_STOP=1 -f design/a18/alert_production_schema_REVIEW_ONLY.sql > /tmp/a18_wrong_target.log 2>&1; then
            echo "FAIL: migration unexpectedly accepted missing Production markers"
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -At -c "
            SELECT CASE WHEN to_regclass('public.alert_preferences') IS NULL
                         AND to_regclass('public.user_notifications') IS NULL
                        THEN 'PASS: wrong-target transaction left no alert tables'
                        ELSE 'FAIL: wrong-target transaction created alert tables' END;" | grep '^PASS:'

# ALL SQL runs only against Docker postgres:17 ephemeral GH Actions service.
# Zero access to Lovable Production / Staging, no Supabase project credentials,
# no account creation in any real system, no real JWT or PostgREST validation.
