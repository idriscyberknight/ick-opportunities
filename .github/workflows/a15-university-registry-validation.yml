name: A1.5 University Registry — typecheck and build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/university-registry-*"
      - "src/routes/_authenticated/admin.universities.tsx"
      - "src/routes/_authenticated/admin.review.tsx"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/a15-university-registry-validation.yml"

permissions:
  contents: read

concurrency:
  group: a15-university-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Strict TypeScript, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Bun (locked dependencies)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Vite build and strict TypeScript check (no publishing)
        # TanStack router generates routeTree.gen.ts during Vite build.
        # Checking types before generating routes creates false route errors.
        run: bun run build

      - name: One-time review only — format A1.5 source and emit content for connector-controlled commits
        run: |
          bunx prettier --write \
            src/lib/university-registry-schema.types.ts \
            src/lib/university-registry-admin.ts \
            src/routes/_authenticated/admin.universities.tsx \
            src/routes/_authenticated/admin.review.tsx \
            vite.config.ts \
            package.json
          for file in \
            src/lib/university-registry-schema.types.ts \
            src/lib/university-registry-admin.ts \
            src/routes/_authenticated/admin.universities.tsx \
            src/routes/_authenticated/admin.review.tsx \
            vite.config.ts \
            package.json; do
            echo "ICK_A15_FORMATTED_START $file"
            base64 -w0 "$file"
            echo
            echo "ICK_A15_FORMATTED_END $file"
          done

      - name: ESLint
        run: bun run lint
