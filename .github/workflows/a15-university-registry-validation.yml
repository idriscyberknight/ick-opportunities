name: A1.5 University Registry — typecheck and build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/university-registry-*"
      - "tests/a15/**"
      - "docs/database/ICK_UNIVERSITY_REGISTRY_SCHEMA_DRAFT.sql"
      - "src/routes/_authenticated/admin.universities.tsx"
      - "src/routes/_authenticated/admin.review.tsx"
      - "package.json"
      - "vite.config.ts"
      - "bun.lock"
      - ".github/workflows/a15-university-registry-validation.yml"

permissions:
  contents: read

concurrency:
  group: a15-university-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Strict TypeScript, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Bun (locked dependencies)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Vite build and strict TypeScript check (no publishing)
        # TanStack router generates routeTree.gen.ts during Vite build.
        # Checking types before generating routes creates false route errors.
        run: bun run build

      - name: Isolated PostgreSQL draft persistence and RLS test (NO production access)
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: "postgres"
          PGDATABASE: "postgres"
          PGPASSWORD: "isolated-ci-only"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -f tests/a15/isolated_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/database/ICK_UNIVERSITY_REGISTRY_SCHEMA_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/a15/isolated_registry_acceptance.sql

      - name: ESLint — A1.5 changed application sources (required)
        run: |
          bunx eslint \
            src/lib/university-registry-schema.types.ts \
            src/lib/university-registry-admin.ts \
            src/routes/_authenticated/admin.universities.tsx \
            src/routes/_authenticated/admin.review.tsx \
            vite.config.ts

      - name: Repository-wide ESLint — known preexisting formatting debt (report only)
        # Legacy repo-wide formatting issues are tracked separately from A1.5.
        # Do not misrepresent this report as a green full-repository lint pass.
        continue-on-error: true
        run: bun run lint
